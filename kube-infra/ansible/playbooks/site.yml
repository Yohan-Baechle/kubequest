---
- name: Preparer les noeuds
  hosts: k3s_cluster
  become: true
  roles:
    - common
    - efs

- name: Installer le control plane
  hosts: server
  become: true
  roles:
    - k3s_server

- name: Installer les workers
  hosts: agents
  become: true
  roles:
    - k3s_agent

- name: Etiqueter les workers
  hosts: server
  become: true
  tasks:
    - name: Ajouter le role worker
      ansible.builtin.command: >-
        k3s kubectl label node {{ item }}
        node-role.kubernetes.io/worker=worker --overwrite
      loop: "{{ groups['agents'] }}"
      changed_when: false
