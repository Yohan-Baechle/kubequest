---
# Desinstalle le cluster pour pouvoir le reprovisionner a blanc avec site.yml.
# Les donnees de /mnt/efs/pv ne sont pas touchees : l'EFS est seulement demonte.
- name: Desinstaller les workers
  hosts: agents
  become: true
  tasks:
    - name: Chercher le script de desinstallation
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-agent-uninstall.sh
      register: agent_uninstall

    - name: Desinstaller l'agent k3s
      ansible.builtin.command: /usr/local/bin/k3s-agent-uninstall.sh
      when: agent_uninstall.stat.exists
      changed_when: true

- name: Desinstaller le control plane
  hosts: server
  become: true
  tasks:
    - name: Chercher le script de desinstallation
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-uninstall.sh
      register: server_uninstall

    - name: Desinstaller le serveur k3s
      ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
      when: server_uninstall.stat.exists
      changed_when: true

    - name: Supprimer le kubeconfig
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube/config"
        state: absent

- name: Demonter l'EFS
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Retirer le montage et son entree fstab
      ansible.posix.mount:
        path: "{{ efs_mount_point }}"
        state: absent
