---
- name: Creer le point de montage
  ansible.builtin.file:
    path: "{{ efs_mount_point }}"
    state: directory
    mode: "0755"

- name: Monter l'EFS
  ansible.posix.mount:
    path: "{{ efs_mount_point }}"
    src: "{{ efs_dns }}:/"
    fstype: nfs4
    opts: nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport,_netdev
    state: mounted

# L'EFS est partage : un seul noeud cree le repertoire, sinon les trois se
# marchent dessus.
- name: Creer le repertoire des volumes
  ansible.builtin.file:
    path: "{{ efs_mount_point }}/pv"
    state: directory
    mode: "0777"
  run_once: true
