---
- name: Installer l'agent k3s
  ansible.builtin.shell:
    cmd: >-
      curl -sfL https://get.k3s.io |
      INSTALL_K3S_VERSION={{ k3s_version }}
      K3S_URL=https://{{ hostvars[groups['server'][0]].node_ip }}:6443
      K3S_TOKEN={{ hostvars[groups['server'][0]].k3s_token }}
      INSTALL_K3S_EXEC="agent --node-ip={{ node_ip }}"
      sh -
    creates: /usr/local/bin/k3s

- name: Activer le service
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
