---
- name: Installer le serveur k3s
  ansible.builtin.shell:
    cmd: >-
      curl -sfL https://get.k3s.io |
      INSTALL_K3S_VERSION={{ k3s_version }}
      INSTALL_K3S_EXEC="server {{ k3s_server_args | join(' ') }}"
      sh -
    creates: /usr/local/bin/k3s

- name: Attendre que l'API reponde
  ansible.builtin.wait_for:
    port: 6443
    host: "{{ node_ip }}"
    timeout: 180

- name: Lire le token d'enrolement
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: node_token

- name: Exposer le token aux agents
  ansible.builtin.set_fact:
    k3s_token: "{{ node_token.content | b64decode | trim }}"

- name: Creer le repertoire kube
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0700"

- name: Lire le kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: kubeconfig

- name: Ecrire le kubeconfig pour l'utilisateur
  ansible.builtin.copy:
    content: "{{ kubeconfig.content | b64decode }}"
    dest: "/home/{{ ansible_user }}/.kube/config"
    owner: "{{ ansible_user }}"
    mode: "0600"
