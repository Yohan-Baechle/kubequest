---
# Ansible s'execute depuis node-1 : le groupe de securite n'autorise pas les
# acces SSH et 6443 depuis l'exterieur, et nous n'avons pas le droit de le
# modifier. node-1 se joint donc en local et les workers par leurs IP privees.
all:
  vars:
    ansible_user: ec2-user
    ansible_python_interpreter: /usr/bin/python3

  children:
    k3s_cluster:
      children:
        server:
          hosts:
            node-1:
              ansible_connection: local
              node_ip: 10.0.0.239
              instance_id: i-053b2016e9a5dc459
        agents:
          hosts:
            node-2:
              ansible_host: 10.0.0.55
              node_ip: 10.0.0.55
              instance_id: i-0402d50c33a35cf19
            node-3:
              ansible_host: 10.0.0.4
              node_ip: 10.0.0.4
              instance_id: i-029a3af4299b00e26
